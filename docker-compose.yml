services:
  api:
    build: .
    command: uvicorn specprobe.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SPECPROBE_DATABASE_URL: sqlite:////data/specprobe.db
      SPECPROBE_VECTOR_PATH: /data/chroma
      SPECPROBE_AUTH_MODE: individual
      SPECPROBE_ADMIN_SECRET_FILE: /run/secrets/admin_secret
    secrets:
      - admin_secret
    volumes:
      - specprobe-data:/data
  ui:
    build: .
    command: streamlit run src/specprobe/ui/app.py --server.address 0.0.0.0
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      SPECPROBE_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
secrets:
  admin_secret:
    file: ${SPECPROBE_ADMIN_SECRET_PATH:?Provide a local administrator secret file path}
volumes:
  specprobe-data:
