[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specprobe"
version = "0.1.0"
description = "Offline, deterministic UDS conformance test generation proof of concept"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "chromadb>=0.5",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "streamlit>=1.38",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["hypothesis>=6.110", "pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
